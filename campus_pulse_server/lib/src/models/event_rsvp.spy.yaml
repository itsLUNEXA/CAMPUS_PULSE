class: EventRsvp
table: event_rsvp
fields:
  eventId: int, relation(parent=campus_event, onDelete=Cascade)
  authUserId: UuidValue
  studentName: String
  teamName: String?
  teamMemberNames: List<String>?
  teamMemberEmails: List<String>?
  createdAt: DateTime, default=now

indexes:
  event_rsvp_unique_idx:
    fields: eventId, authUserId
    unique: true
