class: CampusEvent
table: campus_event
fields:
  title: String
  description: String
  category: String
  startTime: DateTime
  endTime: DateTime?
  venue: String
  bannerUrl: String?
  organizerAuthUserId: UuidValue
  organizerName: String
  rsvpCount: int, default=0
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now

indexes:
  event_category_idx:
    fields: category
  event_start_time_idx:
    fields: startTime

