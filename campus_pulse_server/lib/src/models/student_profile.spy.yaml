class: StudentProfile
table: student_profile
fields:
  authUserId: UuidValue, unique
  fullName: String
  email: String, unique
  branch: String
  academicYear: int
  hostelOrArea: String
  bio: String?
  subjectInterests: List<String>
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now

indexes:
  student_auth_user_idx:
    fields: authUserId
    unique: true
  student_email_idx:
    fields: email
    unique: true
  student_branch_year_idx:
    fields: branch, academicYear

