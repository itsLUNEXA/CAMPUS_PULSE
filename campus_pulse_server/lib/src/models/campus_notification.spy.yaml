class: CampusNotification
table: campus_notifications
fields:
  authUserId: UuidValue
  title: String
  message: String
  type: String
  targetRoute: String?
  targetId: String?
  isRead: bool, default=false
  createdAt: DateTime, default=now
  eventIdTag: String?

indexes:
  notif_user_read_idx:
    fields: authUserId, isRead
  notif_dedup_idx:
    fields: authUserId, eventIdTag
